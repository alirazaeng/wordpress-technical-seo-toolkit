name: Technical SEO Integration

on:
  push:
    branches:
      - main
    paths:
      - 'plugin/**'
      - 'tests/**'
      - '.wp-env.json'
      - '.github/workflows/integration.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'plugin/**'
      - 'tests/**'
      - '.wp-env.json'
      - '.github/workflows/integration.yml'

permissions:
  contents: read

jobs:
  integration:
    name: WordPress Runtime SEO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install wp-env
        run: npm install --global @wordpress/env@11.16.0

      - name: Start disposable WordPress
        run: wp-env start --update

      - name: Show active plugins
        run: wp-env run cli wp plugin list --status=active

      - name: Run Technical SEO integration smoke tests
        run: wp-env run cli wp atst-test

      - name: Destroy disposable environment
        if: always()
        run: wp-env destroy
